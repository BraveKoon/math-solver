name: TestFlight
# 맥 없이 GitHub의 macOS 서버에서 빌드·서명·TestFlight 업로드. 수동 실행(Actions 탭 → Run workflow).
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Check secrets
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::GitHub 시크릿 누락: $v (docs/TESTFLIGHT_NO_MAC.md 참고)"; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8_BASE64 }}" ] || { echo "::error::GitHub 시크릿 누락: ASC_KEY_P8_BASE64"; exit 1; }

      - run: npm ci
      - run: npm test
      - name: Fetch llama.cpp xcframework
        run: npm run fetch:llama
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build && npx cap sync ios
      - name: Cache bundled default model
        uses: actions/cache@v4
        with:
          path: ios/App/App/BundledModels
          key: bundled-models-${{ hashFiles('src/models.js') }}
      - name: Bundle default model into the app
        run: node scripts/fetch-bundled-model.mjs && du -sh ios/App/App/BundledModels/*

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      # 빌드(Archive)는 서명 없이 하고, 내보내기 단계에서 Apple이 관리하는 배포용 인증서로 서명한다.
      # 빌드 단계에서 자동 서명을 쓰면 GitHub 러너(매번 새 머신)마다 새 'Apple Development: Created via API'
      # 인증서가 생겨 계정 인증서 한도를 채운다(실제로 발생). 배포용 클라우드 인증서는 재사용된다.
      - name: Archive (unsigned; signed at export)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Verify export-compliance key in the archived app
        run: |
          P="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "ITSAppUsesNonExemptEncryption = $(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$P" 2>&1)"
          echo "CFBundleIdentifier = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$P" 2>&1)"
          echo "Version = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$P" 2>&1) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$P" 2>&1))"

      - name: Export options
        run: |
          for dest in export upload; do
          cat > "$RUNNER_TEMP/ExportOptions-$dest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$dest</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          done

      # 먼저 IPA로 내보내 최종 서명·권한(확장 메모리 등)을 확인한 뒤 업로드
      - name: Export signed IPA and verify entitlements
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/ipa/x" && unzip -q "$RUNNER_TEMP"/ipa/*.ipa -d "$RUNNER_TEMP/ipa/x"
          APP=$(echo "$RUNNER_TEMP"/ipa/x/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/ent.plist"
          grep -q "increased-memory-limit" "$RUNNER_TEMP/ent.plist" && echo "OK: increased-memory-limit present" \
            || echo "::warning::increased-memory-limit entitlement missing in the signed app"

      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Show distribution logs on failure
        if: failure()
        run: |
          # 업로드 실패 원인 확인용. 시크릿 값은 GitHub가 자동으로 *** 로 가립니다.
          find "${TMPDIR:-/tmp}" -path '*xcdistributionlogs*' -name '*.log' 2>/dev/null | while read -r f; do
            echo "=== $f"; grep -iE "error|fail|denied|not found|forbidden|bundle|app record|provision" "$f" | tail -n 40
          done

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

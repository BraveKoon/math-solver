<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Math Solver</title>
</head>
<body>
  <div id="app">
    <header>
      <h1>∑ Math Solver</h1>
      <span id="status" class="badge">대기 중</span>
      <button id="settingsBtn" aria-label="설정">⚙︎</button>
    </header>

    <section id="setup" class="card">
      <h2>모델 준비</h2>
      <label>실행 방식
        <select id="backend">
          <option value="browser">브라우저 내장 (WebGPU, 완전 오프라인)</option>
          <option value="ollama">로컬 Ollama 서버 (PC, 큰 모델)</option>
        </select>
      </label>
      <label id="modelRow">모델
        <select id="model"></select>
      </label>
      <label id="ollamaRow" hidden>Ollama 주소 / 모델명
        <div class="row">
          <input id="ollamaUrl" value="http://localhost:11434" />
          <input id="ollamaModel" value="qwen3:8b" />
        </div>
      </label>
      <button id="loadBtn" class="primary">모델 불러오기</button>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="progressText" class="hint"></p>
      <p class="hint">처음 한 번만 모델을 내려받고(인터넷 필요), 이후에는 기기에 저장되어 비행기 모드에서도 동작합니다.</p>
    </section>

    <main id="chat" aria-live="polite"></main>

    <form id="form">
      <textarea id="input" rows="2" placeholder="수학 문제를 입력하세요. 예) x^2 - 5x + 6 = 0 을 풀어줘"></textarea>
      <div class="actions">
        <button type="button" id="stopBtn" hidden>중지</button>
        <button type="submit" id="sendBtn" class="primary" disabled>풀기</button>
      </div>
    </form>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h2>설정</h2>
      <label>사고 모드 (Qwen3 등, 정확하지만 느림)
        <input type="checkbox" id="thinking" checked />
      </label>
      <label>Temperature <output id="tempOut">0.3</output>
        <input type="range" id="temp" min="0" max="1" step="0.1" value="0.3" />
      </label>
      <label>최대 토큰
        <input type="number" id="maxTokens" value="4096" min="256" step="256" />
      </label>
      <label>시스템 프롬프트
        <textarea id="sys" rows="5"></textarea>
      </label>
      <div class="actions">
        <button id="clearBtn" type="button">대화 지우기</button>
        <button id="clearCacheBtn" type="button">모델 캐시 삭제</button>
        <button class="primary" value="close">닫기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

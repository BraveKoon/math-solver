<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>오일러 · Math Solver</title>
</head>
<body>
  <div id="app">
    <!-- 왼쪽 서랍: 세션 목록 -->
    <aside id="drawer" aria-label="세션 목록">
      <div class="drawer-head">
        <h1>오일러</h1>
        <button id="searchBtn" class="circle" aria-label="검색" title="검색">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </div>
      <input id="search" type="search" placeholder="세션 검색" hidden />
      <nav class="drawer-menu">
        <button id="menuModels" class="menu-item">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>모델
        </button>
        <button id="menuSettings" class="menu-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정
        </button>
      </nav>
      <div id="sessionList" class="session-list"></div>
      <div class="drawer-foot">
        <span class="engine-badge" id="engineBadge"></span>
        <button id="newSession" class="pill-dark">＋ 새 세션</button>
      </div>
    </aside>
    <div id="scrim" hidden></div>

    <!-- 본문 -->
    <div id="main">
      <header>
        <button id="menuBtn" class="circle" aria-label="세션 목록">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        </button>
        <div id="title" class="title">새 세션</div>
        <button id="newBtn" class="circle" aria-label="새 세션" title="새 세션">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <div id="empty">
        <div class="mark">∑</div>
        <h2>무엇을 풀어볼까요?</h2>
        <p>인터넷 없이, 제한 없이, 내 기기에서 수학 문제를 풀어드려요.</p>
        <div class="chips">
          <button type="button" class="chip" data-q="x^2 - 5x + 6 = 0 을 풀어줘">x² − 5x + 6 = 0 풀기</button>
          <button type="button" class="chip" data-q="∫₀¹ x·eˣ dx 를 계산해줘">∫₀¹ x·eˣ dx</button>
          <button type="button" class="chip" data-q="세 변이 3, 4, 5 인 삼각형의 넓이와 외접원 반지름은?">삼각형 넓이와 외접원</button>
          <button type="button" class="chip" data-q="행렬 [[2,1],[1,2]] 의 고윳값과 고유벡터를 구해줘">고윳값 구하기</button>
        </div>
      </div>

      <main id="chat" aria-live="polite"></main>

      <form id="form">
        <div class="composer">
          <div id="attachments" class="attachments" hidden></div>
          <textarea id="input" rows="1" placeholder="오일러에게 물어보기"></textarea>
          <div class="bar">
            <button type="button" id="attachBtn" class="circle small" aria-label="이미지 첨부" title="이미지 첨부">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button type="button" id="modelChip" class="model-chip" aria-label="모델 선택">
              <span id="modelChipName">오일러</span>
              <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <span class="spacer"></span>
            <button type="button" id="stopBtn" class="round" aria-label="중지" hidden>
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>
            </button>
            <button type="submit" id="sendBtn" class="round accent" aria-label="보내기" disabled>
              <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">AI 답변은 틀릴 수 있어요. 중요한 결과는 꼭 검산하세요.</p>
      </form>
    </div>
  </div>

  <input id="fileInput" type="file" accept="image/*" multiple hidden />

  <!-- 모델 선택 시트 -->
  <dialog id="modelSheet" class="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <button class="circle" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2>모델 선택</h2>
      <span class="circle-spacer"></span>
    </div>
    <ul id="modelList" class="card list"></ul>
    <div class="card row-item">
      <label class="switch-row">
        <span><b>사고 모드</b><small>더 정확하지만 느려요 (지원 모델만)</small></span>
        <input type="checkbox" id="thinking" role="switch" />
      </label>
    </div>
    <button id="moreToggle" class="card row-item more">
      <b>더 많은 모델</b><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <ul id="moreList" class="card list" hidden></ul>
    <p id="storageInfo" class="sheet-note"></p>
  </dialog>

  <!-- 설정 -->
  <dialog id="settings" class="sheet">
    <div class="grab"></div>
    <div class="sheet-head">
      <button class="circle" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2>설정</h2>
      <span class="circle-spacer"></span>
    </div>
    <div class="card form">
      <label>창의성(Temperature) <output id="tempOut">0.6</output>
        <input type="range" id="temp" min="0" max="1" step="0.1" value="0.6" />
      </label>
      <label>최대 답변 길이(토큰)
        <input type="number" id="maxTokens" value="2048" min="256" step="256" />
      </label>
      <label>시스템 프롬프트
        <textarea id="sys" rows="6"></textarea>
      </label>
    </div>
    <div class="card form">
      <button id="resetSys" type="button" class="text-btn">시스템 프롬프트 기본값으로</button>
      <button id="clearAll" type="button" class="text-btn danger">모든 세션 삭제</button>
    </div>
    <p class="sheet-note" id="aboutInfo"></p>
  </dialog>

  <div id="toast" role="status" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
